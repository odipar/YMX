<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title description">
<title id="title">YMX architecture</title>
<desc id="description">The RhYMe export group prepares a YMXS tune and uses the YMXR tools to package it as SNDH or a TOS program. Tune file data includes the DTX3 tune table and DTX1 sources. In Atari ST playback, a frame applies a DTX3 row, writes registers, controls MFP timers and selects the active mapping. Each timer tick reads a DTX1 source row and applies the active mapping to its last value. Both paths write to the YM2149.</desc>
