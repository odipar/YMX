name: Publish standalone YMX EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  publish-win64:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MSVC toolchain for Native AOT
        uses: ilammy/msvc-dev-cmd@v1

      - name: Publish NativeAOT standalone EXE
        shell: pwsh
        run: |
          dotnet publish dotnet -c Release -r win-x64 --self-contained true `
            -p:PublishAot=true `
            -p:UseAppHost=true `
            -p:AssemblyName=ym-to-ymx `
            -p:DebugType=none `
            -o dist/standalone/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ym-to-ymx-win-x64
          path: dist/standalone/win-x64/
          if-no-files-found: error
