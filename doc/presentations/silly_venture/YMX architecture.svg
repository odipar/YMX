<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title description">
<title id="title">YMX architecture</title>
<desc id="description">RhYMe prepares YMXS data offline. The YMXR tools package it as SNDH or a TOS program. On the Atari ST, the host frame clock and ST4-compressed DTX3 frame rows drive the YMXR frame procedure. The frame procedure writes YM2149 registers and controls the MFP timer. Timer ticks read a DTX1 source row and write target registers through an optional lookup.</desc>
